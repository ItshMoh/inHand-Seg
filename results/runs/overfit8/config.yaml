run_name: overfit8
seed: 0
data:
  train_root: /data/egohos_512
  train_file_list: configs/dev_subset_500.txt
  subset:
    per_source: 2
    min_class_share: 0.01
  augment: false
  num_workers: 8
model:
  pretrained: nvidia/mit-b0
  class_names:
  - background
  - hand
  - interacting_object
  freeze_encoder: false
train:
  max_iters: 500
  batch_size: 8
  warmup_iters: 25
  lr: 6.0e-05
  head_lr_mult: 10.0
  weight_decay: 0.01
  poly_power: 1.0
  bf16: true
  log_every: 10
  ckpt_every: 0
eval:
  splits:
  - train
  boundary_dilation_ratio: 0.02
  n_vis: 8
  min_fg_iou: 0.9
